services:
  - type: web
    name: binary-marketplace
    runtime: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm run start:server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_PATH
        value: /var/data/marketplace.db
      - key: AUTO_SEED
        value: true
      - key: DELETE_DB
        sync: false
      - key: ADMIN_TOKEN
        sync: false
    disk:
      name: marketplace-data
      mountPath: /var/data
      sizeGB: 1
